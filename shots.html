<!-- ============ SHOTS ============ -->
<section class="section section--first" id="shots">
  <div class="wrap">
    <div class="section__head section__head--alt reveal">
      <h2 class="section__title">shots</h2>
      <p class="section__desc">
        Frames pulled from <a href="https://www.instagram.com/havea.capture/" target="_blank" rel="noopener" style="text-decoration:underline;">@havea.capture</a> —
        streets, light, and the in-between moments.
      </p>
    </div>

    <div class="shots-track-wrap reveal">
      <div class="shots-track" id="shotsTrack">
        <div class="shot" style="background:url('assets/img/img5.jpeg') center/cover no-repeat;">
          <svg class="shot__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/></svg>
          <span class="shot__label">FRAME_001</span>
        </div>
        <div class="shot" style="background:url('assets/img/img2.jpeg') center/cover no-repeat;">
          <svg class="shot__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/></svg>
          <span class="shot__label">FRAME_002</span>
        </div>
        <div class="shot" style="background:url('assets/img/img3.jpeg') center/cover no-repeat;">
          <svg class="shot__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/></svg>
          <span class="shot__label">FRAME_003</span>
        </div>
        <div class="shot" style="background:url('assets/img/img4.jpeg') center/cover no-repeat;">
          <svg class="shot__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/></svg>
          <span class="shot__label">FRAME_004</span>
        </div>
        <div class="shot" style="background:url('assets/img/img1.jpeg') center/cover no-repeat;">
          <svg class="shot__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/></svg>
          <span class="shot__label">FRAME_005</span>
        </div>
      </div>
      <div class="shots-controls">
        <button class="icon-btn" onclick="scrollShots(-1)" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="icon-btn" onclick="scrollShots(1)" aria-label="Next">

        </button>
      </div>
    </div>
